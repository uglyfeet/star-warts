<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Meta tags for search engines -->
    <meta
      name="description"
      content="Star Warts, a space themed game where you play as a pilot trying to save the galaxy from the evil Space Feet.">
    <meta
      name="keywords"
      content="space, game, pilot, galaxy, evil, feet, invaders, invading, save, fun, adventure">
    <title>Star Warts | Game </title>

    <!--favicon-->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/favicon/apple-icon-180x180.png">
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon/favicon-32x32.png">
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon/favicon-16x16.png">


    <!-- Bootstrap CSS Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet"
          href="assets/css/shared.css">

    <link rel="stylesheet"
          href="assets/css/game.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark custom-nav">

    <div class="container-fluid">
        <a class="navbar-brand" href="game.html">
            <img src="assets/favicon/apple-icon-180x180.png" alt="Star Warts logo" class="navbar-logo">
            <span class="ms-2">Star Warts</span>
        </a>

        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link active"
                       href="index.html">
                        Mission Briefing
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="game.html">
                        Play Game
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<div class="container-fluid  game-wrapper">
    <div class="row">

        <!-- Score and Lives at top of the screen -->
        <div class="col-12 text-center">
            <h4>
                Score: 0 |
                Lives: 3
            </h4>
        </div>
    </div>

    <div class="row justify-content-center">
        <!-- Game Board -->
        <div class="col-12 col-md-10 col-lg-8">
            <div id="game-board">
            <!-- the space ship odour-eater -->
                <div id="player">
                    <img src="assets/images/odour-eater.png"
                    alt="Odoureater Starship">
                </div>
            </div>
        </div>
    </div>

    <!-- Controls Panel -->
    <div class="row">

    <div class="col-12">

<div id="controls-panel">

    <div id="fire-button">
        FIRE
    </div>

    <div id="move-area">
        <span>←</span>
        <span>→</span>
    </div>

</div>       </div>

    </div>

    </div>
</div>



<!-- Bootstrap JS Script-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

<script src="assets/js/game.js"></script>

</body>

</html>
